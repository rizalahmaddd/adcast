name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two production deploys at once; a newer run waits instead of cancelling a live one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # A manual dispatch must still start from main, so a feature branch can never reach production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The real config carries the account id, D1 id and domain, so it lives in the production
      # environment's secrets rather than the repo. See docs/deployment.md for the one-time setup.
      - name: Write Wrangler config
        env:
          WRANGLER_CONFIG_MAIN: ${{ secrets.WRANGLER_CONFIG_MAIN }}
        run: |
          if [ -z "$WRANGLER_CONFIG_MAIN" ]; then
            echo "::error::The production environment needs the WRANGLER_CONFIG_MAIN secret. See docs/deployment.md."
            exit 1
          fi
          umask 077
          printf '%s\n' "$WRANGLER_CONFIG_MAIN" > wrangler.jsonc

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Non-interactive CI applies without a prompt and keeps a D1 backup before each migration.
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply adcast --remote --config wrangler.jsonc

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
